# OSIRIS — Docker Compose
# Self-host altyapı servis haritası (bkz. doküman §11.2)
# Varsayılan olarak yalnızca temel veri katmanı başlatılır.

name: osiris

services:
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: osiris-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osiris_dev_password}
      POSTGRES_DB: osiris
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osiris-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: osiris-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-osiris}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-osiris_dev_password}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  n8n:
    image: n8nio/n8n:latest
    container_name: osiris-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-osiris_dev_password}
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "5678:5678"

  freshrss:
    image: freshrss/freshrss:latest
    container_name: osiris-freshrss
    restart: unless-stopped
    environment:
      TZ: UTC
      CRON_MIN: "*/5"
    volumes:
      - freshrssdata:/var/www/FreshRSS/data
    ports:
      - "8080:80"

  nginx:
    image: nginx:alpine
    container_name: osiris-nginx
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
  redisdata:
  miniodata:
  n8ndata:
  freshrssdata:
