[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-collector"
version = "0.1.0"
description = "OSIRIS Collector Manager — veri toplama plugin'lerini yönetir"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "redis>=5.0",
    "apscheduler>=3.10",
    "pydantic>=2.0",
]

[project.scripts]
osiris-collector = "osiris_collector.cli:main"

[tool.setuptools.packages.find]
include = ["osiris_collector*"]
