[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-api"
version = "0.1.0"
description = "OSIRIS REST API sunucusu"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[project.scripts]
osiris-api = "osiris_api.main:run"

[tool.setuptools.packages.find]
include = ["osiris_api*"]
