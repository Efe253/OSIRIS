[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-alert"
version = "0.1.0"
description = "OSIRIS Alert Manager — uyarı ve anomali tespiti"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["osiris_alert*"]
