[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-pipeline"
version = "0.1.0"
description = "OSIRIS Processing Pipeline — temizleme, NER, sınıflandırma, embedding"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "beautifulsoup4>=4.12",
    "langdetect>=1.0",
    "spacy>=3.7",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["osiris_pipeline*"]
