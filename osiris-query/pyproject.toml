[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-query"
version = "0.1.0"
description = "OSIRIS Query Engine — tam metin ve semantik arama"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["osiris_query*"]
