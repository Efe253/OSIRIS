[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-sdk"
version = "0.1.0"
description = "OSIRIS OSINT platformu paylaşılan Python SDK'sı"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["osiris*"]
