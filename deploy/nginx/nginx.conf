# OSIRIS — Nginx ters proxy yapılandırması
# Ağ topolojisi için bkz. doküman §11.3

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Temel güvenlik başlıkları
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    # NOT: üretimde 443 + TLS sertifikası ekleyin (Caddy otomatik HTTPS
    # alternatifi için bkz. doküman §4.8) ve aşağıdaki HSTS satırını açın:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Basit hız sınırlama (kaba kuvvet / tarama koruması)
    limit_req_zone $binary_remote_addr zone=osiris_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=osiris_login:10m rate=2r/s;

    # API Gateway
    upstream osiris_api {
        server osiris-api:8000;
    }

    server {
        listen 80;
        server_name _;

        # /api/* → osiris-api (/api öneki sıyrılır: /api/search → /search,
        # çünkü FastAPI rotaları öneksiz tanımlı)
        location /api/ {
            limit_req zone=osiris_api burst=20 nodelay;
            proxy_pass http://osiris_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # /n8n/* → n8n
        location /n8n/ {
            proxy_pass http://n8n:5678/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /rss/* → freshrss
        location /rss/ {
            proxy_pass http://freshrss:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /ui/* → osiris-web-ui
        location /ui/ {
            proxy_pass http://osiris-web-ui:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
