[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-report"
version = "0.1.0"
description = "OSIRIS Report Generator — rapor üretimi ve dışa aktarım"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "jinja2>=3.1",
]

[tool.setuptools.packages.find]
include = ["osiris_report*"]
