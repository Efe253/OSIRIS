[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-graph"
version = "0.1.0"
description = "OSIRIS Graph Engine — varlık ilişki grafı analizi"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "networkx>=3.2",
]

[tool.setuptools.packages.find]
include = ["osiris_graph*"]
