[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = [
    "osiris-sdk/tests",
    "osiris-pipeline/tests",
    "osiris-graph/tests",
    "osiris-alert/tests",
    "osiris-report/tests",
]
